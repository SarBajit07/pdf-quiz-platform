[project]
name = "pdf-quiz-api"
version = "0.1.0"
description = "FastAPI backend for the PDF quiz platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.9,<3",
    "email-validator>=2.2,<3",
    "pdfplumber>=0.11,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
